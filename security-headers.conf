# ==========================================================================
# Cabeceras de seguridad compartidas — coachdsantos.com
#
# POR QUÉ EXISTE ESTE ARCHIVO: en nginx, un `location` que declara su propio
# `add_header` DEJA DE HEREDAR los add_header del bloque `server`. Como los
# locations de assets y de HTML añaden su propio Cache-Control, cada uno debe
# re-incluir este archivo o perdería TODAS las cabeceras de seguridad.
#
# NOTA SOBRE LA CSP: el sitio usa Tailwind/Alpine/Lucide/GSAP por CDN, estilos
# y <script> inline, y Alpine necesita 'unsafe-eval' — por eso la CSP no puede
# ser estricta sin romper el sitio. Es "realista": permite exactamente los
# orígenes que el HTML usa hoy. Si se añade un CDN nuevo, hay que sumarlo aquí.
# Las fuentes Switzer se sirven desde cdn.fontshare.com (el CSS viene de
# api.fontshare.com) — ambos son necesarios en font-src.
# DS Hub (2026-10-19): /ds-runtime.js lee la configuración publicada por Dee en
# connect-src (app.coachdsantos.com y el provisional coach-dee-lab…easypanel.host),
# los videos/fotos que suba van en media-src (img-src ya admite https:), y
# frame-ancestors permite al Hub embeber la landing para la vista previa.
# ==========================================================================

# Evita que el navegador "adivine" tipos MIME (anti MIME-sniffing).
add_header X-Content-Type-Options "nosniff" always;

# Anti-clickjacking: lo controla frame-ancestors en la CSP (abajo). Desde 2026-10-19 el
# DS Hub (panel de Dee) embebe la landing en un iframe para la vista previa, y
# X-Frame-Options no admite una lista de orígenes, así que se retira: la CSP manda.

# No filtrar la URL completa como referer a terceros.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactiva APIs del navegador que este sitio no usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# HSTS: fuerza HTTPS durante 1 año. EasyPanel/Let's Encrypt ya sirve TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy — ajustada a los orígenes reales del sitio.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://api.fontshare.com https://cdn.fontshare.com data:; img-src 'self' data: https:; media-src 'self' https://app.coachdsantos.com https://coach-dee-lab.mddv2l.easypanel.host; connect-src 'self' https://api.web3forms.com https://app.coachdsantos.com https://coach-dee-lab.mddv2l.easypanel.host; form-action https://api.web3forms.com; frame-ancestors 'self' https://app.coachdsantos.com https://coach-dee-lab.mddv2l.easypanel.host; base-uri 'self'; object-src 'none'" always;
