# ==========================================================================
# Coach Demetrius Santos — landing estática servida por nginx (EasyPanel/VPS).
# Sirve site/v2 (espejo). Cabeceras de seguridad: ver security-headers.conf
# (incluido en server Y en cada location que declara add_header propio —
# nginx no hereda add_header cuando un location define el suyo).
# ==========================================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Cabeceras de seguridad para cualquier respuesta sin location específico.
    include /etc/nginx/security-headers.conf;

    # Redirecciones relativas (Location: /link/). Detrás de Traefik el
    # contenedor habla http; con la forma absoluta nginx emitía
    # http://www.coachdsantos.com/... y obligaba a un segundo salto a https.
    absolute_redirect off;

    # ----- /linkbio → /link/ (2026-10-19) -----
    # La bio de Instagram de Dee enlaza a coachdsantos.com/linkbio; la página
    # real es /link/. Sin esto todo el tráfico de IG caía en un 404.
    location = /linkbio  { return 301 /link/; }
    location = /linkbio/ { return 301 /link/; }

    # ----- /hub → panel de Dee (DS Hub) (2026-10-20) -----
    # Link corto y memorable para el panel mientras no exista app.coachdsantos.com
    # (DNS pendiente de Dee). Cuando exista, cambiar el destino aquí.
    location = /hub  { return 302 https://coach-dee-lab.mddv2l.easypanel.host/; }
    location = /hub/ { return 302 https://coach-dee-lab.mddv2l.easypanel.host/; }

    # ----- Compresión (el HTML de ~59KB baja a ~14KB) -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml text/plain;

    # ----- Assets (fotos, video, fuentes): caché larga -----
    # Su contenido cambia con cada build/deploy; un mes de caché evita que
    # visitantes recurrentes re-descarguen el video de 2.8MB.
    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|avif|mp4|webm|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ----- HTML: revalidar siempre (los deploys se ven al instante; ETag → 304) -----
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # No exponer la versión de nginx en las cabeceras.
    server_tokens off;
}
